<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SR Duty</title>
  <link rel="manifest" href="/sr-duty/manifest.json">
  <meta name="theme-color" content="#1b4332">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { color: #1b4332; font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 32px; }
    .btn {
      display: block; width: 100%; padding: 14px;
      border-radius: 10px; border: none; font-size: 16px;
      font-weight: 600; cursor: pointer; text-decoration: none;
      margin-bottom: 12px; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: #1b4332; color: white; }
    .btn-push { background: #2196F3; color: white; }
    .btn-push:disabled { background: #90CAF9; cursor: not-allowed; }
    .status {
      margin-top: 16px; padding: 12px; border-radius: 8px;
      font-size: 13px; display: none;
    }
    .status.success { background: #e8f5e8; color: #1b4332; display: block; }
    .status.error { background: #ffebee; color: #c62828; display: block; }
    .status.info { background: #e3f2fd; color: #1565c0; display: block; }
    hr { border: none; border-top: 1px solid #eee; margin: 20px 0; }
    #pushBtn { display: none; }
    #pushDone { display: none; color: #2d6a4f; font-size: 14px; margin-top: 12px; }
    .user-label { font-size: 12px; color: #999; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏕️</div>
    <h1>SR Duty</h1>
    <p class="subtitle">Система записи на дежурства<br>Спасрезерв</p>

    <a id="formLink"
       href="https://script.google.com/macros/s/AKfycbwYgCcREJqLMySth04799JI3txyOyNE57nNUXnrmneWEvt7N0bT6IwOsUr3ImoPrfo5/exec"
       class="btn btn-primary">📅 Открыть форму дежурств</a>

    <hr>

    <div id="userLabel" class="user-label" style="display:none"></div>
    <button id="pushBtn" class="btn btn-push" onclick="subscribePush()">
      🔔 Подключить push-уведомления
    </button>
    <div id="pushDone">✅ Push-уведомления подключены</div>
    <div id="status" class="status"></div>
  </div>

  <script>
    const VAPID_PUBLIC_KEY = 'BLGjoiNgcPgEGG6YBbk6936hrjHVtFBDxBgtUig7ZaCk7_TYJJ2A_tfCnDGSs8e1TJ1uZ1319-_JOZGjETFNr60';
    const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwYgCcREJqLMySth04799JI3txyOyNE57nNUXnrmneWEvt7N0bT6IwOsUr3ImoPrfo5/exec';

    // Читаем имя пользователя из URL параметра ?user=...
    const urlParams = new URLSearchParams(window.location.search);
    const userName = urlParams.get('user') || '';

    if (userName) {
      const label = document.getElementById('userLabel');
      label.textContent = 'Пользователь: ' + userName;
      label.style.display = 'block';
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    function urlBase64ToUint8Array(b) {
      const p = '='.repeat((4 - b.length % 4) % 4);
      const base64 = (b + p).replace(/-/g, '+').replace(/_/g, '/');
      return Uint8Array.from([...atob(base64)].map(c => c.charCodeAt(0)));
    }

    async function initSW() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        showStatus('Ваш браузер не поддерживает push-уведомления', 'error');
        return;
      }
      try {
        await navigator.serviceWorker.register('/sr-duty/sw.js');
        const reg = await navigator.serviceWorker.ready;
        const existing = await reg.pushManager.getSubscription();
        if (existing) {
          document.getElementById('pushDone').style.display = 'block';
        } else if (userName) {
          // Показываем кнопку только если знаем кто пользователь
          document.getElementById('pushBtn').style.display = 'block';
        } else {
          showStatus('Откройте эту страницу через кнопку в форме дежурств', 'info');
        }
      } catch(e) {
        console.error('SW error:', e);
      }
    }

    async function subscribePush() {
      if (!userName) {
        showStatus('Неизвестный пользователь. Откройте страницу через форму дежурств.', 'error');
        return;
      }
      const btn = document.getElementById('pushBtn');
      btn.disabled = true;
      btn.textContent = 'Подключение...';
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          showStatus('Разрешите уведомления в браузере', 'error');
          btn.disabled = false;
          btn.textContent = '🔔 Подключить push-уведомления';
          return;
        }
        const reg = await navigator.serviceWorker.ready;
        const subscription = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });

        // Сохраняем подписку через Apps Script doGet (GET, не POST!)
        // Важно: ссылки вида script.google.com/.../exec всегда отвечают
        // редиректом (302) на script.googleusercontent.com. Браузер по
        // стандарту Fetch при редиректе ПОСТ-запроса меняет метод на GET
        // и обрезает тело — из-за этого doPost никогда не вызывался и
        // подписка не сохранялась. GET при редиректе метод не меняет,
        // поэтому все данные передаём через query-параметры.
        const pushUrl = BACKEND_URL +
          '?action=savePushSubscription' +
          '&user=' + encodeURIComponent(userName) +
          '&subscription=' + encodeURIComponent(JSON.stringify(subscription));

        await fetch(pushUrl, { method: 'GET', mode: 'no-cors' });

        // С no-cors мы не получим ответ, но запрос дошёл
        document.getElementById('pushBtn').style.display = 'none';
        document.getElementById('pushDone').style.display = 'block';
        showStatus('Push-уведомления успешно подключены!', 'success');
      } catch(e) {
        console.error(e);
        showStatus('Ошибка: ' + e.message, 'error');
        btn.disabled = false;
        btn.textContent = '🔔 Подключить push-уведомления';
      }
    }

    initSW();
  </script>
</body>
</html>
